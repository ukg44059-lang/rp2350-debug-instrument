# User authorized retaining the PB2 blink demo on this specific STM32F407.
source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
adapter speed 100
reset_config none
cortex_m reset_config sysresetreq
$_TARGETNAME configure -event reset-start { adapter speed 100 }
$_TARGETNAME configure -event reset-init { adapter speed 100 }
gdb port disabled
tcl port disabled
telnet port disabled
init
if {[lindex [read_memory 0x1fff7a22 16 1] 0] != 1024} {error "Unexpected Flash size"}
set expected_uid {0x30001d 0x32334709 0x32313836}
set actual_uid [read_memory 0x1fff7a10 32 3]
for {set i 0} {$i < 3} {incr i} {
    if {[lindex $actual_uid $i] != [lindex $expected_uid $i]} {error "Target UID mismatch"}
}
program artifacts/pb2-demo/stm32f407-pb2-blink.elf verify reset exit
