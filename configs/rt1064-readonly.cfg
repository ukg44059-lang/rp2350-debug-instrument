# Read-only Cortex-M7 identity probe; deliberately defines no Flash bank or erase command.
source [find configs/probe-rp2350.cfg]
source [find target/swj-dp.tcl]
set CHIPNAME rt1064_probe
set CPUTAPID 0x0bd11477
swj_newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $CPUTAPID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -endian little -dap $CHIPNAME.dap
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
init
poll
if {[$CHIPNAME.cpu curstate] eq "running"} {halt}
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set dhcsr [lindex [read_memory 0xe000edf0 32 1] 0]
set apidr [lindex [read_memory 0xe00fffe0 32 1] 0]
echo [format "CPUID=0x%08x DHCSR=0x%08x APIDR=0x%08x" $cpuid $dhcsr $apidr]
if {$cpuid != 0x411fc271} {error "Unexpected Cortex-M7 CPUID; no target memory modified"}
if {[$CHIPNAME.cpu curstate] eq "halted"} {resume}
shutdown
