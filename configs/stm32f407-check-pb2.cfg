# Observe the running demo without halting it; no SysTick CTRL reads (COUNTFLAG clears).
source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
if {![info exists CHECK_KHZ]} {set CHECK_KHZ 100}
adapter speed $CHECK_KHZ
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
init
poll
if {[stm32f4x.cpu curstate] ne "running"} {error "PB2 demo is not running"}
set moder [lindex [read_memory 0x40020400 32 1] 0]
if {(($moder >> 4) & 3) != 1} {error "PB2 is not configured as an output"}
set reload [lindex [read_memory 0xe000e014 32 1] 0]
if {$reload != 3199999} {error "Unexpected SysTick period"}
echo [format "GPIOB_MODER=0x%08x SYSTICK_RELOAD=%u" $moder $reload]
set low_seen 0
set high_seen 0
for {set i 0} {$i < 14} {incr i} {
    set odr [lindex [read_memory 0x40020414 32 1] 0]
    set idr [lindex [read_memory 0x40020410 32 1] 0]
    set level [expr {($odr >> 2) & 1}]
    set input [expr {($idr >> 2) & 1}]
    echo "PB2_SAMPLE $i OUTPUT=$level INPUT=$input"
    if {$level == 0} {set low_seen 1} else {set high_seen 1}
    sleep 60
}
if {!$low_seen || !$high_seen} {error "PB2 did not toggle during observation"}
echo "PB2_BLINK_RUNNING_CONFIRMED"
if {[info exists PB2_READBACK]} {dump_image $PB2_READBACK 0x08000000 484}
shutdown
