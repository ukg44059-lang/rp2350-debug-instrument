# Flash-read-only backup; temporarily halt a running core and resume on exit.
source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
adapter speed 100
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
init
set actual_kb [lindex [read_memory 0x1fff7a22 16 1] 0]
if {$actual_kb != 1024} { error "Unexpected Flash size; refusing fixed-size backup" }
set expected_uid {0x30001d 0x32334709 0x32313836}
set actual_uid [read_memory 0x1fff7a10 32 3]
for {set i 0} {$i < 3} {incr i} {
    if {[lindex $actual_uid $i] != [lindex $expected_uid $i]} { error "Target UID mismatch" }
}
if {![info exists BACKUP_START]} {set BACKUP_START 0}
if {$BACKUP_START < 0 || $BACKUP_START > 63} {error "Invalid backup start block"}
if {![info exists BACKUP_SPEED]} {set BACKUP_SPEED 100}
adapter speed $BACKUP_SPEED
poll
set initial_state [stm32f4x.cpu curstate]
if {$initial_state ne "running" && $initial_state ne "halted"} { error "Cannot determine initial core state" }
set was_running [expr {$initial_state eq "running"}]
halt 2000
echo "Core halted for 1024-KB Flash backup; no erase/write."
set backup_error [catch {
for {set i $BACKUP_START} {$i < 64} {incr i} {
    set address [expr {0x08000000 + $i * 16384}]
    set first [format "artifacts/backups/chunks/%02d-a.bin" $i]
    set second [format "artifacts/backups/chunks/%02d-b.bin" $i]
    foreach name [list $first $second] {
        set succeeded 0
        for {set retry 0} {$retry < 4} {incr retry} {
            if {![catch {dump_image $name $address 16384} failure]} {set succeeded 1;break}
            echo "Read retry at [format 0x%08x $address]: $failure"
            catch {stm32f4x.dap dpreg 0 0x1e}
            sleep 20
        }
        if {!$succeeded} {error "Backup stopped: repeated read failure"}
    }
    echo [format "BACKUP_CHUNK %02d/64 complete" [expr {$i+1}]]
}
} backup_message]
if {$was_running} { resume }
if {$backup_error} { error $backup_message }
shutdown
