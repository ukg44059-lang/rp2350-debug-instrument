source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
# The upstream target script sets its own default speed; override it afterwards.
adapter speed 100
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled

init
echo "=== Read-only target inspection; no halt, reset or Flash programming ==="
echo [format "CPUID: 0x%08x" [lindex [read_memory 0xe000ed00 32 1] 0]]
echo [format "DBGMCU_IDCODE: 0x%08x" [lindex [read_memory 0xe0042000 32 1] 0]]
echo [format "FLASH_SIZE_KB: %u" [lindex [read_memory 0x1fff7a22 16 1] 0]]
echo "UID_WORDS: [read_memory 0x1fff7a10 32 3]"
echo "FLASH_VECTOR_WORDS: [read_memory 0x08000000 32 16]"
shutdown
