# Explicitly DESTRUCTIVE: run only after user authorizes replacing target firmware.
source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
adapter speed 100
reset_config none
cortex_m reset_config sysresetreq
$_TARGETNAME configure -event reset-start { adapter speed 100 }
$_TARGETNAME configure -event reset-init { adapter speed 100 }
gdb port disabled
tcl port disabled
telnet port disabled
init
if {[lindex [read_memory 0x1fff7a22 16 1] 0] != 1024} { error "Unexpected target Flash size" }
set expected_uid {0x30001d 0x32334709 0x32313836}
set actual_uid [read_memory 0x1fff7a10 32 3]
for {set i 0} {$i < 3} {incr i} {
    if {[lindex $actual_uid $i] != [lindex $expected_uid $i]} { error "Target UID mismatch" }
}
if {![file exists artifacts/backups/stm32f407-original-30001d-32334709-32313836.bin]} { error "Original Flash backup missing" }
if {[file size artifacts/backups/stm32f407-original-30001d-32334709-32313836.bin] != 1048576} { error "Original backup incomplete" }
program artifacts/target-test/stm32f407-selftest.elf verify reset exit
