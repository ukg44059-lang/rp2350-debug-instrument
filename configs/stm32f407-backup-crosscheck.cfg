# Third complete read, cross-checking the image assembled across two sessions.
source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
adapter speed 500
reset_config none
gdb port disabled
tcl port disabled
telnet port disabled
init
poll
set initial_state [stm32f4x.cpu curstate]
if {$initial_state ne "running" && $initial_state ne "halted"} {error "Cannot determine initial core state"}
halt 2000
set read_error [catch {
    dump_image artifacts/backups/stm32f407-crosscheck.bin 0x08000000 0x100000
} read_message]
if {$initial_state eq "running"} {resume}
if {$read_error} {error $read_message}
echo "THIRD_FLASH_READ_COMPLETE"
shutdown
