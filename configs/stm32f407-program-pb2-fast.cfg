# Same authorized PB2 image; erase exactly sector 0, transfer only actual BIN bytes.
if {![info exists PROBE_KHZ]} {set PROBE_KHZ 100}
if {$PROBE_KHZ < 50 || $PROBE_KHZ > 1000} {error "Unsupported prototype clock"}
source [find configs/probe-rp2350.cfg]
source [find target/stm32f4x.cfg]
adapter speed $PROBE_KHZ
reset_config none
cortex_m reset_config sysresetreq
$_TARGETNAME configure -event reset-start [list adapter speed $PROBE_KHZ]
$_TARGETNAME configure -event reset-init [list adapter speed $PROBE_KHZ]
gdb port disabled
tcl port disabled
telnet port disabled
init
if {[lindex [read_memory 0x1fff7a22 16 1] 0] != 1024} {error "Unexpected Flash size"}
set expected_uid {0x30001d 0x32334709 0x32313836}
set actual_uid [read_memory 0x1fff7a10 32 3]
for {set i 0} {$i < 3} {incr i} {
    if {[lindex $actual_uid $i] != [lindex $expected_uid $i]} {error "Target UID mismatch"}
}
reset init
echo "** Erase Started **"
flash erase_sector 0 0 0
echo "** Erase Finished **"
echo "** Write Started **"
flash write_bank 0 artifacts/pb2-demo/stm32f407-pb2-blink.bin 0
echo "** Write Finished **"
echo "** Verify Started **"
verify_image artifacts/pb2-demo/stm32f407-pb2-blink.bin 0x08000000 bin
echo "** Verified OK **"
echo "** Resetting Target **"
reset run
shutdown
